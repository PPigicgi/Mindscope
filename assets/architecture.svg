<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">MindScope edge-to-PC system architecture</title>
  <desc id="architecture-desc">A horizontal flow from IMX477 camera and ReSpeaker microphone capture through the NIX Jetson edge device to three PC inference branches, then to a spoken response on NIX speakers and a separate web dashboard screening output.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#22D3EE"/>
    </marker>
    <style>
      .bg { fill: #0B1020; }
      .panel { fill: #111831; stroke: #4F46E5; stroke-width: 2; }
      .node { fill: #151D38; stroke: #22D3EE; stroke-width: 2; }
      .quality { fill: #151D38; stroke: #F59E0B; stroke-width: 2; }
      .boundary { fill: none; stroke: #22D3EE; stroke-width: 2; stroke-dasharray: 8 7; }
      .flow { fill: none; stroke: #22D3EE; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { fill: #CBD5E1; font: 600 16px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #CBD5E1; font: 14px Arial, sans-serif; text-anchor: middle; }
      .section { fill: #CBD5E1; font: 700 19px Arial, sans-serif; }
      .caption { fill: #22D3EE; font: 600 14px Arial, sans-serif; }
      .amber { fill: #F59E0B; font: 600 13px Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="620" rx="20"/>
  <text class="section" x="30" y="38">EDGE CAPTURE</text>
  <text class="section" x="392" y="38">PC INFERENCE</text>
  <text class="section" x="970" y="38">SEPARATE OUTPUTS</text>

  <rect class="boundary" x="25" y="58" width="335" height="505" rx="18"/>
  <text class="caption" x="45" y="84">PRIVACY BOUNDARY · NIX CAPTURE</text>

  <rect class="node" x="45" y="120" width="135" height="90" rx="12"/>
  <text class="label" x="112.5" y="154">IMX477</text>
  <text class="small" x="112.5" y="178">camera module</text>

  <rect class="node" x="205" y="120" width="135" height="90" rx="12"/>
  <text class="label" x="272.5" y="154">ReSpeaker</text>
  <text class="small" x="272.5" y="178">microphone array</text>

  <path class="flow" data-flow="camera-to-nix" d="M112.5 210 V235 H177 V258" marker-end="url(#arrow)"/>
  <path class="flow" data-flow="microphone-to-nix" d="M272.5 210 V235 H208 V258" marker-end="url(#arrow)"/>

  <rect class="node" x="85" y="258" width="230" height="115" rx="14"/>
  <text class="label" x="200" y="291">NIX</text>
  <text class="small" x="200" y="319">NVIDIA Jetson</text>
  <text class="small" x="200" y="341">Orin Nano Super</text>
  <text class="small" x="200" y="360">session transport</text>

  <path class="flow" d="M315 315 H405"/>

  <rect class="panel" x="390" y="58" width="545" height="505" rx="18"/>
  <rect class="node" x="410" y="260" width="145" height="110" rx="12"/>
  <text class="label" x="482.5" y="299">Session API</text>
  <text class="small" x="482.5" y="324">validated contract</text>
  <text class="small" x="482.5" y="347">modality states</text>

  <path class="flow" d="M555 315 H580 V135 H605"/>
  <path class="flow" d="M555 315 H605"/>
  <path class="flow" d="M555 315 H580 V487 H605"/>

  <rect class="node" x="605" y="95" width="140" height="80" rx="12"/>
  <text class="label" x="675" y="128">Whisper STT</text>
  <text class="small" x="675" y="151">local transcript</text>
  <path class="flow" d="M745 135 H965"/>

  <rect class="quality" x="605" y="245" width="140" height="140" rx="12"/>
  <text class="label" x="675" y="277">Audio quality</text>
  <text class="label" x="675" y="299">+ HuBERT</text>
  <text class="amber" x="675" y="329">quality gate</text>
  <text class="small" x="675" y="354">missing / unusable</text>
  <text class="small" x="675" y="375">audio is skipped</text>
  <path class="flow" d="M745 315 H770"/>

  <rect class="node" x="770" y="270" width="140" height="90" rx="12"/>
  <text class="label" x="840" y="307">XGBoost</text>
  <text class="small" x="840" y="333">or MLP</text>
  <path class="flow" d="M910 315 H965"/>

  <rect class="node" x="605" y="425" width="140" height="125" rx="12"/>
  <text class="label" x="675" y="460">OpenFace</text>
  <text class="small" x="675" y="484">AU · pose · gaze</text>
  <text class="small" x="675" y="508">49-D contract</text>
  <path class="flow" d="M745 487 H770"/>

  <rect class="node" x="770" y="447" width="140" height="80" rx="12"/>
  <text class="label" x="840" y="481">Mamba</text>
  <text class="small" x="840" y="504">video track</text>
  <path class="flow" d="M910 487 H940 V380 H965"/>

  <rect class="node" x="965" y="83" width="210" height="105" rx="14"/>
  <text class="label" x="1070" y="116">Spoken response</text>
  <text class="small" x="1070" y="143">→ NIX stereo speakers</text>
  <text class="small" x="1070" y="166">interaction output</text>

  <rect class="node" x="965" y="280" width="210" height="135" rx="14"/>
  <text class="label" x="1070" y="319">Screening output</text>
  <text class="small" x="1070" y="347">→ web dashboard</text>
  <text class="small" x="1070" y="374">separate from speech</text>
  <text class="small" x="1070" y="397">research workflow only</text>

  <text class="small" x="600" y="595">Signals move from bounded edge capture to explicit PC branches and distinct output paths.</text>
</svg>
